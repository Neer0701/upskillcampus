<!DOCTYPE html>
<html>

<head>

<title>URL Shortener</title>

<style>

body{

font-family:Arial;
background:#f2f2f2;
text-align:center;
margin-top:80px;

}

input{

width:450px;
padding:10px;

}

button{

padding:10px 20px;
background:#007bff;
color:white;
border:none;
cursor:pointer;

}

a{

font-size:18px;

}

</style>

</head>

<body>

<h1>Python URL Shortener</h1>

<form method="POST">

<input
type="text"
name="url"
placeholder="Enter Long URL"
required>

<br><br>

<button type="submit">
Shorten URL
</button>

</form>

{% if short_url %}

<h3>Short URL</h3>

<a href="{{ short_url }}" target="_blank">
{{ short_url }}
</a>

{% endif %}

</body>

</html>
